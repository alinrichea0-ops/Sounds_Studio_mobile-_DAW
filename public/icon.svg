<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142238"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0084ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Waveform / Equalizer Bars -->
  <g transform="translate(64, 110)">
    <!-- Equalizer bars -->
    <rect x="20" y="160" width="24" height="100" rx="12" fill="url(#cyanGrad)" />
    <rect x="64" y="90" width="24" height="170" rx="12" fill="url(#cyanGrad)" />
    <rect x="108" y="40" width="24" height="220" rx="12" fill="#00e5ff" filter="url(#glow)" />
    <rect x="152" y="120" width="24" height="140" rx="12" fill="url(#cyanGrad)" />
    
    <!-- Central Play Dial Symbol -->
    <circle cx="270" cy="150" r="72" fill="#0c1626" stroke="#00e5ff" stroke-width="6" filter="url(#glow)"/>
    <polygon points="255,120 302,150 255,180" fill="#00e5ff"/>

    <!-- Right Equalizer bars -->
    <rect x="360" y="80" width="24" height="180" rx="12" fill="url(#cyanGrad)" />
    <rect x="404" y="140" width="24" height="120" rx="12" fill="url(#cyanGrad)" />
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">SOUNDSTUDIO</text>
  <text x="256" y="462" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#00e5ff" letter-spacing="6">MOBILE DAW</text>
</svg>
